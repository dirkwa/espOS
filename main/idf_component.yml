## Example app manifest. ESP32-P4 has no radio: WiFi is provided by an
## ESP32-C6 co-processor over SDIO through Espressif's esp_hosted transport
## and the esp_wifi_remote shim (same esp_wifi_* API). Other targets use the
## native driver and pull nothing.
dependencies:
  idf: ">=6.0.0"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "^2.12.0"
    rules:
      - if: "target == esp32p4"
