## espos_log component manifest: registry metadata for espos/espos_log.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
version: "0.7.0"
description: "Log ring served over REST, so a device is debuggable without a serial cable"
url: "https://github.com/espos/espos/tree/main/components/espos_log"
repository: "https://github.com/espos/espos.git"
documentation: "https://github.com/espos/espos/blob/main/docs/rest-api.md"
issues: "https://github.com/espos/espos/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - logging
  - rest
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
dependencies:
  idf: ">=6.0.0,<6.1.0"
