## espos_httpd component manifest: registry metadata for signalk-espos/espos_httpd.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
version: "0.7.0"
description: "HTTP server, REST API, SSE, the web UI from a LittleFS partition"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_httpd"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/rest-api.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - http
  - rest
  - sse
  - web-ui
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  # Sibling espOS components. override_path makes an in-tree build (and a
  # firmware that vendors espOS as a submodule) use the checkout next to this
  # file instead of downloading espos/<name> from the registry; a copy fetched
  # from the registry has no such directory and the field is ignored there.
  signalk-espos/espos_config:
    version: "^0.7.0"
    override_path: "../espos_config"
  signalk-espos/espos_log:
    version: "^0.7.0"
    override_path: "../espos_log"
  # Registry dependencies, exact-pinned (docs/decisions.md).
  espressif/cjson: "==1.7.19~2"
  joltwallet/littlefs:
    version: "==1.22.3"
    rules:
      - if: "target != linux"
