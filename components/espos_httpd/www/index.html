<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espOS</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; margin: 1.5rem auto; max-width: 44rem; padding: 0 1rem; color: #222; }
  h1 { font-weight: 600; margin-bottom: 0; }
  h3 { margin: 1.4rem 0 .4rem; }
  .sub { color: #666; margin-top: .25rem; }
  pre { background: #f4f4f4; padding: .75rem; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .5rem 0; }
  input, select, button { font: inherit; padding: .4rem .6rem; }
  input { min-width: 12rem; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 1rem; background: #ddd; font-size: 13px; }
  .ok { background: #cfe9cf; } .bad { background: #f3d1d1; } .warn { background: #f7e7b5; }
  #msg { color: #a33; }
</style>
</head>
<body>
<h1>espOS</h1>
<p class="sub">Setup page (the full UI arrives in M5). The API is live under <code>/api/v1</code>.</p>

<h3>WiFi <span id="wstate" class="badge">…</span></h3>
<div id="wdetail" class="sub"></div>
<form id="wform" class="row" autocomplete="off">
  <input id="ssid" list="ssids" placeholder="Network (SSID)" required>
  <datalist id="ssids"></datalist>
  <input id="psk" type="password" placeholder="Password (empty = open)">
  <button type="submit">Join</button>
  <button type="button" id="scan">Scan</button>
</form>
<div id="msg"></div>

<h3>SignalK <span id="skstate" class="badge">…</span></h3>
<div id="skdetail" class="sub"></div>
<div class="row">
  <select id="skservers"><option value="">(auto)</option></select>
  <button type="button" id="skuse">Use</button>
  <button type="button" id="skdiscover">Discover</button>
  <button type="button" id="skrequest">Request access</button>
  <button type="button" id="skforget">Forget token</button>
</div>
<form id="sktokform" class="row" autocomplete="off">
  <input id="sktoken" placeholder="Paste a token" style="min-width:20rem">
  <button type="submit">Use token</button>
</form>
<div id="skmsg" class="sub"></div>

<h3>System</h3>
<pre id="info">loading…</pre>
<h3>Configuration <a href="/api/v1/config/schema" target="_blank" style="font-size:13px;font-weight:normal">schema</a></h3>
<pre id="cfg">loading…</pre>

<script>
const $ = id => document.getElementById(id);
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body !== undefined ? {"Content-Type": "application/json"} : {},
                                body: body !== undefined ? JSON.stringify(body) : undefined });
  let js = null; try { js = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, js };
}
function showWifi(w) {
  const cls = w.state === "connected" ? "ok" : (w.state === "backoff" || w.reason.code ? "bad" : "warn");
  $("wstate").className = "badge " + cls;
  $("wstate").textContent = w.state + (w.portal && w.portal.active ? " · portal " + w.portal.ssid : "");
  const bits = [];
  if (w.ssid) bits.push(`${w.ssid} (${w.rssi} dBm, ch ${w.channel})`);
  if (w.ip) bits.push(`IP ${w.ip}`);
  if (w.reason && w.reason.code) bits.push(`last: ${w.reason.text} [${w.reason.code}]`);
  if (w.backoff_ms) bits.push(`retry in ${Math.ceil(w.backoff_ms / 1000)} s`);
  if (w.attempt) bits.push(`attempt ${w.attempt}`);
  $("wdetail").textContent = bits.join(" · ") || "hostname " + w.hostname;
}
async function loadAll() {
  const [i, c, w] = await Promise.all([api("GET", "/api/v1/system/info"), api("GET", "/api/v1/config"), api("GET", "/api/v1/wifi/status")]);
  $("info").textContent = JSON.stringify(i.js, null, 2);
  $("cfg").textContent = JSON.stringify(c.js, null, 2);
  if (w.js) showWifi(w.js);
}
$("wform").onsubmit = async e => {
  e.preventDefault();
  $("msg").textContent = "";
  const r = await api("PUT", "/api/v1/config", { wifi: { ssid0: $("ssid").value, psk0: $("psk").value } });
  $("msg").textContent = r.ok ? "saved — connecting…" : `error: ${r.js && (r.js.message || r.js.error)}`;
};
$("scan").onclick = async () => {
  const r = await api("POST", "/api/v1/wifi/scan", {});
  $("msg").textContent = r.ok ? "scanning…" : `scan failed: ${r.js && (r.js.message || r.js.error)}`;
};
function fillScan(s) {
  const dl = $("ssids"); dl.innerHTML = "";
  (s.results || []).sort((a, b) => b.rssi - a.rssi).forEach(r => {
    const o = document.createElement("option"); o.value = r.ssid; o.label = `${r.ssid} (${r.rssi} dBm, ${r.auth})`; dl.appendChild(o);
  });
  if (!s.scanning) $("msg").textContent = `${(s.results || []).length} network(s) found`;
}
function showSk(d) {
  const t = d.token, cls = t.state === "approved" || t.state === "open" ? "ok" : (t.state === "denied" || t.state === "error" ? "bad" : "warn");
  $("skstate").className = "badge " + cls; $("skstate").textContent = t.state;
  const bits = [];
  if (d.server && d.server.host) bits.push(`${d.server.name || d.server.host}:${d.server.port} (${d.server.source})`);
  if (t.pending_href) bits.push(`waiting for approval ${t.pending_s || 0}s — approve "${d.description}" in the server admin UI`);
  if (t.approved_s !== undefined) bits.push(`approved ${t.approved_s}s ago`);
  if (t.last_error) bits.push(t.last_error);
  bits.push(`clientId ${d.client_id}`);
  $("skdetail").textContent = bits.join(" · ");
}
function fillServers(s) {
  const sel = $("skservers"); const cur = sel.value; sel.innerHTML = '<option value="">(auto)</option>';
  (s.servers || []).forEach(r => { const o = document.createElement("option"); o.value = r.self; o.textContent = `${r.name || r.host} ${r.host}:${r.port} ${r.swvers}${r.selected ? " ✓" : ""}`; sel.appendChild(o); });
  sel.value = cur;
}
$("skuse").onclick = () => api("PUT", "/api/v1/config", { sk: { server_self: $("skservers").value } }).then(r => $("skmsg").textContent = r.ok ? "server preference saved" : "error");
$("skdiscover").onclick = () => api("POST", "/api/v1/sk/discover", {}).then(() => $("skmsg").textContent = "discovering…");
$("skrequest").onclick = () => api("POST", "/api/v1/sk/request", {}).then(() => $("skmsg").textContent = "requesting…");
$("skforget").onclick = () => api("POST", "/api/v1/sk/forget", {}).then(() => $("skmsg").textContent = "token forgotten");
$("sktokform").onsubmit = e => { e.preventDefault(); api("POST", "/api/v1/sk/token", { token: $("sktoken").value }).then(r => { $("skmsg").textContent = r.ok ? "verifying token…" : `error: ${r.js && r.js.message}`; $("sktoken").value = ""; }); };
api("GET", "/api/v1/sk/status").then(r => r.js && showSk(r.js));
api("GET", "/api/v1/sk/servers").then(r => r.js && fillServers(r.js));
try {
  const es = new EventSource("/api/v1/events");
  es.addEventListener("sk", e => showSk(JSON.parse(e.data)));
  es.addEventListener("sk_servers", e => fillServers(JSON.parse(e.data)));
  es.addEventListener("wifi", e => showWifi(JSON.parse(e.data)));
  es.addEventListener("wifi_scan", e => fillScan(JSON.parse(e.data)));
  es.addEventListener("config", () => api("GET", "/api/v1/config").then(c => $("cfg").textContent = JSON.stringify(c.js, null, 2)));
} catch (e) {}
loadAll();
api("GET", "/api/v1/wifi/scan").then(s => s.js && fillScan(s.js));
</script>
</body>
</html>
